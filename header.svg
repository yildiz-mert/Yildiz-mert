<svg xmlns="http://www.w3.org/2000/svg" width="820" height="150" viewBox="0 0 820 150">
  <style>
    .name { font: 800 58px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: -2.5px; fill: #1f2328; }
    .tag  { font: 400 19px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #57606a; }
    .accent { fill: #f5a524; }
